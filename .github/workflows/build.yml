name: Build Telegram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up JDK 17 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set JAVA_HOME to JDK 11 for Gradle
        run: echo "JAVA_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV

      - name: Setup Android SDK (with JDK 17)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Debug APK (with JDK 11)
        run: ./gradlew assembleDebug --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-custom-apk
          path: TMessagesProj/build/outputs/apk/debug/*.apk
